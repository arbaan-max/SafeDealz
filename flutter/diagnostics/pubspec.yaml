name: safedealz_diagnostics
description: "SafeDealz Diagnostics app — Android device tests and signed diagnostic result QR."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.1.0

  # Networking. Retrofit declarations and implementations are generated.
  dio: ^5.10.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  # Routing
  go_router: ^18.0.1

  # Environment and storage
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  intl: ^0.20.2

  # UI and streams
  google_fonts: ^8.2.0
  flutter_svg: ^2.3.0
  shimmer: ^4.0.0
  rxdart: ^0.28.0
  fluttertoast: ^10.0.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

  # Codegen: swagger/swagger.json -> Dio/Retrofit clients + Freezed DTOs.
  build_runner: ^2.15.1
  swagger_parser: ^1.44.3
  retrofit_generator: ^10.2.9
  freezed: ^3.1.0
  json_serializable: ^6.14.1

  # Asset generation tools are configured when approved artwork is available.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/svg/

flutter_native_splash:
  color: "#0369A1"
  android_12:
    color: "#0369A1"
  web: false
