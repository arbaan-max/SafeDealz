name: safedealz_store_manager
description: "SafeDealz Store Manager app — branch device intake, auction management, pickup, rewards, and support."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.1.0

  # Networking. Retrofit declarations and implementations are generated.
  dio: ^5.10.0
  retrofit: ">=4.4.0 <4.9.0"
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Routing
  go_router: ^17.3.0

  # Environment and storage
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  intl: ^0.20.2

  # UI and streams
  google_fonts: ^8.2.0
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  rxdart: ^0.28.0
  fluttertoast: ^9.1.0
  package_info_plus: ">=9.0.0 <10.0.0"
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

  # Codegen: swagger/swagger.json -> Dio/Retrofit clients + Freezed DTOs.
  build_runner: ^2.4.13
  swagger_parser: ^1.20.2
  retrofit_generator: ^9.1.5
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Asset generation tools are configured when approved artwork is available.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/svg/

flutter_native_splash:
  color: "#0369A1"
  android_12:
    color: "#0369A1"
  web: false
