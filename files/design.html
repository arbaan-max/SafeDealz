const select=(label,name,options,value)=>`<div class="field"><label>${label}<select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label></div>`;

function platformRate(amount){return amount<=20000?8:amount<=30000?7:6;}
function platformFee(amount){return Math.round(Math.max(0,amount)*platformRate(amount))/100;}
function bidCost(amount){return Math.round((amount+platformFee(amount))*100)/100;}
function commitment(){return db.bid?db.bid.amount+(db.bid.fee??platformFee(db.bid.amount)):0;}
function available(){return Math.max(0,db.balance-(db.bid&&['held','processing'].includes(db.bid.state)?commitment():0));}
function held(){return db.bid?.state==='held'?commitment():0;}
function processing(){return db.bid?.state==='processing'?commitment():0;}
function announce(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3600);}
function spec(id){return CATALOG.find(x=>x.id===id)}
function idsFor(role=ui.role){let prefix={manager:'M',vendor:'V',diagnostics:'D',admin:'A'}[role];return CATALOG.filter(x=>x.id[0]===prefix||(x.id[0]==='S'&&role!=='diagnostics'&&!(role==='admin'&&x.id==='S01')));}

function goTo(id,push=true){if(!spec(id))return;if(id==='M04'&&ui.id!=='M04')ui.inspectionStep=0;if(push&&id!==ui.id)ui.history.push(ui.id);ui.id=id;ui.variant='Default';ui.notice='';if(id[0]!=='S')ui.role={M:'manager',V:'vendor',D:'diagnostics',A:'admin'}[id[0]];ui.mode='flow';render();}
function timerMarkup(kind='auction',big=false){const until=kind==='auction'?db.auctionEnd:db.acceptEnd;const fallback=(kind==='auction'?db.settings.bidMinutes:db.settings.acceptMinutes)*60;const sec=until?Math.max(0,Math.ceil((until-Date.now())/1000)):fallback;return `<span class="timer ${big?'big':''}">${ic('clock')}<span class="countdown" data-timer="${kind}">${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}</span></span>`;}
function deviceCard(name='Apple iPhone 14',status='Live auction',dest='M10',price=15000,pink=false){const open=/Live/i.test(status)&&!db.bid;return `<button class="card device-card" data-go="${dest}"><div class="row">${thumb(pink)}<span class="grow"><span class="device-name">${name}</span><span class="device-sub" style="display:block">128 GB / ${pink&&ui.role!=='manager'?'Sangeetha, Koramangala':'PAI, Indiranagar'}</span>${badge(status,/paid|picked|accepted/i.test(status)?'green':/expired|re-auction/i.test(status)?'amber':'purple')}</span></div><div class="lower"><small>${open?'Vendor bidding':'Offer amount'}</small><span class="price">${open?'Open':money(price)}</span>${ic('caret-right')}</div></button>`;}

function homeManager(){return mobile('M01',`<small>PAI / INDIRANAGAR</small><div class="between" style="margin:7px 0 21px"><h1>Hello, Kavya</h1><div class="avatar">KR</div></div>${go('M03','New trade-in','btn','plus')}<section class="section">${head('Ready for your decision','View all','M02')}${deviceCard('Apple iPhone 14',db.payment==='paid'?(db.picked?'Picked up':'Awaiting pickup'):db.auction==='live'?'Live auction':db.auction==='expired'?'Needs re-auction':'Offer ready',db.payment==='paid'?'M14':db.auction==='live'?'M10':db.auction==='expired'?'M15':'M11',db.highest)}<div class="gap"></div><div class="stats"><button class="stat" data-go="M10">${ic('clock')}<strong>${db.auction==='live'?'2':'1'}</strong><span>Live auctions</span></button><button class="stat" data-go="M14">${ic('storefront')}<strong>${db.picked?'2':'3'}</strong><span>Awaiting pickup</span></button></div></section><section class="section">${head('Recent devices','All devices','M02')}${deviceCard('Vivo V23e 5G','Needs re-auction','M15',8500,true)}</section>`, '',{brand:true,back:false,nav:true});}

function applyVariant(id,html,v){if(v==='Default')return html;const msg=v.charAt(0).toUpperCase()+v.slice(1);let n='';if(isvar(v,'Loading'))n=`<div aria-busy="true">${notice('Loading the latest records…')}<div class="skeleton"></div><div class="skeleton"></div></div>`;else if(isvar(v,'Empty')||isvar(v,'no activity')||isvar(v,'no holds')||isvar(v,'no results')||isvar(v,'no balance'))n=empty('Nothing here yet','Records will appear when there is activity for this view.');else if(isvar(v,'Offline')||isvar(v,'disconnect')||isvar(v,'reconnect'))n=notice('Connection unavailable. Showing last known data. Reconnect before continuing.','warning');else if(/invalid|error|failed|denied|missing|incomplete|insufficient|over available|wrong|duplicate|mismatch|not found|forbidden|revoked|deactivated|expired|closed|removed|zero\/negative|unresolved|negative/i.test(v))n=notice(msg+'. Review the information and try the permitted recovery action.','error');else if(/success|complete|saved|confirmed|sent|ready|verified/i.test(v))n=notice(msg,'success');else n=notice(msg+'. This is a reviewable demonstration of this screen state.');
if(id[0]==='A'||ui.role==='admin'){html=html.replace(/(<div class="admin-body">)/,'$1'+n);}else{html=html.replace(/(<div class="app-content"[^>]*>)/,'$1'+n);}return html;}
renderScreen=function(id,v='Default'){let h=id[0]==='S'?sharedScreen(id,v):id[0]==='M'?managerScreen(id,v):id[0]==='V'?vendorScreen(id,v):id[0]==='D'?diagnosticScreen(id,v):adminScreen(id,v);return applyVariant(id,h,v);};

function values(b){const root=b.closest('.modal')||b.closest('[data-screen]')||$('#stage');const out={};root.querySelectorAll('input,select,textarea').forEach(e=>{if(!e.name)return;if(e.type==='radio'){if(e.checked)out[e.name]=e.value}else out[e.name]=e.type==='checkbox'?e.checked:e.value});return out;}
function saveInspectionValues(data){db.checks=db.checks||{};Object.entries(data).forEach(([key,value])=>{if(key.startsWith('check_')&&value)db.checks[key.slice(6)]=value;});if('repair'in data)db.repair=data.repair;if(['box','bill','charger'].some(key=>key in data))db.accessories=['box','bill','charger'].filter(key=>data[key]);}
function validateInspectionStep(data,index=ui.inspectionStep||0){const step=inspectionSteps()[index];const missing=step.items.find(item=>!data['check_'+item.key]&&!db.checks?.[item.key]);if(missing)return 'Choose an answer for '+missing.label+'.';if(step.title==='Accessories, origin & age'){if(!data.repair||data.repair==='Select repair history')return 'Select the repair or parts history.';const age=data.check_deviceAge||db.checks?.deviceAge;if(age!=='11 months or older'&&(!data.bill||!db.billCaptured))return 'Devices below 11 months old require Bill and a live bill capture.';}return '';}
function error(t){ui.notice=t;render();const c=$('[data-screen-content]');if(c)c.scrollTop=0;announce(t);}
function notify(t){db.notifications.unshift(t);const category=/pickup/i.test(t)?'Pickup':/payment|payout|fund/i.test(t)?'Payment':/auction|offer|bid/i.test(t)?'Offer':'General';db.adminNotifications?.unshift({id:'N-'+(1042+db.adminNotifications.length),time:'Just now',source:'System',audience:'Relevant users',category,message:t,delivery:'Delivered'});announce(t);}
function modal(title,body,confirm,action='close-modal'){window.modalPrev=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="between"><h2 id="dialogTitle">${title}</h2>${act('close-modal',ic('x'),'iconbtn')}</div>${body}<div class="gap"></div>${confirm?act(action,confirm):''}${act('close-modal','Close','btn secondary')}</section></div>`;$('#modalRoot button').focus();}
function closeModal(){$('#modalRoot').innerHTML='';window.modalPrev?.focus?.();}
function ledger(type,amount,note){db.ledger.unshift({type,amount,note});}
function release(reason){if(db.bid?.state==='held'){ledger('Release',commitment(),reason+' / bid and platform fee');db.bid.state='released';}}
function closeAuction(){if(db.auction!=='live')return false;db.auction='closed';db.auctionEnd=Date.now();db.acceptEnd=Date.now()+db.settings.acceptMinutes*60000;if(db.bid?.state==='held'){if(db.bid.amount>=db.highest){db.highest=db.bid.amount;db.winner='Uday Mobiles';}else{db.winner='Star Mobiles';release('Not selected / higher offer received');}}db.rounds.push({round:db.round,amount:db.highest,status:'Closed'});notify('Auction closed. The highest offer is ready for manager acceptance.');return true;}
function expireOffer(){if(db.auction==='accepted'||['processing','paid','failed'].includes(db.payment)){announce('This offer is already accepted. Payment obligations do not expire.');return false;}db.auction='expired';db.acceptEnd=Date.now();release('Acceptance expired / Round '+db.round);notify('Offer expired. Reserved funds are available again.');return true;}
function successPayment(){if(!db.kyc){announce('Complete customer verification before releasing the payout.');return false;}if(!['processing','failed'].includes(db.payment)){announce(db.payment==='paid'?'This payment is already confirmed.':'Accept an offer before confirming a store payment.');return false;}let amount=db.bid?.amount||db.highest;if(db.bid?.state==='processing'){db.balance-=commitment();ledger('Platform fee',db.bid.fee??platformFee(amount),'Collected on completed deal');db.bid.state='paid';}db.payment='paid';ledger('Paid',amount,'Store payout / PAY-1042');if(!db.earned){db.points+=amount/10;db.earned=true;}notify('Store payment confirmed. Customer reward points issued once; SMS queued.');return true;}

if(action==='save-customer'){if(db.auction!=='accepted'){error('Accept an offer before entering customer details.');return;}if(!data.newModel?.trim()||!DEVICE_STORAGE.includes(data.newStorage)){error('Enter the purchased device model and select storage.');return;}if(data.newPlatform==='Android'&&!DEVICE_RAM.includes(data.newRam)){error('Select RAM for the purchased Android device.');return;}if(!/^\d{15}$/.test(data.newImei||'')||!/^\d{15}$/.test(data.newImei2||'')){error('Enter both 15-digit IMEIs of the purchased device.');return;}if(data.newImei===data.newImei2){error('Purchased-device IMEI 1 and IMEI 2 must be different.');return;}if(!data.customer?.trim()||!/^\d{10}$/.test(data.phone||'')){error('Enter the customer name and a 10-digit mobile number.');return}if(!db.otp||db.verifiedPhone!==data.phone){error('Verify this customer phone number first.');return}if(!db['Document front']||!db['Customer photo']){error('Capture the identity document and customer photo.');return}if(!data.consent){error('Record the customer ownership and processing acknowledgement.');return}db.kyc=true;Object.assign(db.draft,{customer:data.customer,phone:data.phone,newPlatform:data.newPlatform,newModel:data.newModel,newStorage:data.newStorage,newRam:data.newPlatform==='Android'?data.newRam:'',newImei:data.newImei,newImei2:data.newImei2});db.payoutReleased=true;notify('Customer verification completed. The existing payment instruction is released to the payout provider.');goTo('M13');return}

function filterNotifications(root){const data=values(root.querySelector('[name=notificationSearch]')||root);const q=(data.notificationSearch||'').toLowerCase();let shown=0;root.querySelectorAll('[data-notification-row]').forEach(row=>{const matchText=!q||row.textContent.toLowerCase().includes(q);const matchDate=!data.notificationDate||data.notificationDate==='All dates'||data.notificationDate==='Today'&&row.dataset.date==='Today'||['Last 7 days','Last 30 days'].includes(data.notificationDate);const matchSource=!data.notificationSource||data.notificationSource==='All senders'||row.dataset.source===data.notificationSource;const matchAudience=!data.notificationAudience||data.notificationAudience==='All audiences'||row.dataset.audience===data.notificationAudience;const matchCategory=!data.notificationCategory||data.notificationCategory==='All categories'||row.dataset.category===data.notificationCategory;const matchDelivery=!data.notificationDelivery||data.notificationDelivery==='All delivery states'||row.dataset.delivery===data.notificationDelivery;row.hidden=!(matchText&&matchDate&&matchSource&&matchAudience&&matchCategory&&matchDelivery);if(!row.hidden)shown++;});const count=root.querySelector('[data-notification-count]');if(count)count.textContent=shown+' notifications shown';}
document.addEventListener('change',e=>{const form=e.target.closest('[data-screen]');if(form&&ui.forms)ui.forms[form.dataset.screen]=values(e.target);if(e.target.name==='declineReason'){document.querySelector('[data-other-reason]').hidden=e.target.value!=='Others';}if(e.target.name==='newPlatform'){const data=values(e.target);Object.assign(db.draft,{newPlatform:data.newPlatform,newModel:data.newModel,newStorage:data.newStorage,newImei:data.newImei,newImei2:data.newImei2,...(data.newRam?{newRam:data.newRam}:{})});ui.forms.M08={...ui.forms.M08,...data};ui.notice='';render()}if(e.target.name==='platform'){const data=values(e.target);db.platform=e.target.value;Object.assign(db.draft,data);ui.forms.M03={...ui.forms.M03,...data};ui.notice='';render()}if(e.target.name==='ram'){const data=values(e.target);db.draft.ramChoice=e.target.value;ui.forms.M03={...ui.forms.M03,...data,ram:e.target.value};ui.notice='';render()}if(e.target.name==='warranty'){db.warranty=e.target.value;render()}if(e.target.name==='statusFilter'){const root=e.target.closest('[data-screen]');root?.querySelectorAll('tbody tr').forEach(row=>row.hidden=e.target.value!=='All statuses'&&!row.textContent.toLowerCase().includes(e.target.value.toLowerCase()));}if(e.target.name?.startsWith('notification'))filterNotifications(e.target.closest('[data-screen]'));});

let touchTracing=false;
function clearTouchAt(x,y){const board=document.querySelector('[data-touch-board]');if(!board)return;const touch=db.diagnostic.touch||(db.diagnostic.touch={cleared:[],attempts:1,submitted:false});board.querySelectorAll('[data-touch-dot]:not(.cleared)').forEach(dot=>{const r=dot.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2);if(Math.hypot(dx,dy)<=24){const id=Number(dot.dataset.touchDot);if(!touch.cleared.includes(id))touch.cleared.push(id);dot.classList.add('cleared');}});const total=Number(board.dataset.total)||120,percent=Math.round(touch.cleared.length/total*100),remaining=total-touch.cleared.length;const pct=document.querySelector('[data-touch-percent]'),left=document.querySelector('[data-touch-remaining]');if(pct)pct.textContent=percent;if(left)left.textContent=remaining;board.setAttribute('aria-label','Touch coverage area: '+percent+'% complete');}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-touch-board]'))return;touchTracing=true;clearTouchAt(e.clientX,e.clientY);});
document.addEventListener('pointermove',e=>{if(touchTracing)clearTouchAt(e.clientX,e.clientY);});
document.addEventListener('pointerup',()=>{touchTracing=false;});
document.addEventListener('pointercancel',()=>{touchTracing=false;});
document.addEventListener('keydown',e=>{const m=$('.modal');if(!m)return;if(e.key==='Escape'){closeModal();return}if(e.key==='Tab'){let list=[...m.querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);let first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
setInterval(()=>{$$('[data-timer]').forEach(el=>{let end=el.dataset.timer==='auction'?db.auctionEnd:db.acceptEnd;let sec=end?Math.max(0,Math.ceil((end-Date.now())/1000)):(el.dataset.timer==='auction'?db.settings.bidMinutes:db.settings.acceptMinutes)*60;el.textContent=Math.floor(sec/60).toString().padStart(2,'0')+':'+(sec%60).toString().padStart(2,'0')});if(db.auction==='live'&&Date.now()>=db.auctionEnd){closeAuction();render()}if(db.auction==='closed'&&db.acceptEnd&&Date.now()>=db.acceptEnd){expireOffer();render()}},1000);

const beforeScreenVariant=renderScreen;
renderScreen=function(id,v='Default'){
 const original=db;const preview=v!=='Default';if(preview){db=JSON.parse(JSON.stringify(db));if(/paid|payment confirmed/i.test(v))db.payment='paid';if(/picked up/i.test(v)){db.payment='paid';db.picked=true;}if(/expired/i.test(v)){db.auction='expired';db.acceptEnd=Date.now()-1000;}if(/zero balance|no balance/i.test(v)){db.points=0;db.balance=0;db.bid=null;}if(/failed|attention/i.test(v)&&['M13','A13','V12'].includes(id))db.payment='failed';if(/confirmed/i.test(v)&&id==='V09')db.recharge={amount:10000,state:'confirmed'};if(/failed/i.test(v)&&id==='V09')db.recharge={amount:10000,state:'failed'};}
 let html=beforeScreenVariant(id,v);db=original;
 if(preview){const t=document.createElement('template');t.innerHTML=html;const content=t.content.querySelector('.app-content')||t.content.querySelector('.admin-body');if(content){if(/^empty$|^no activity$|^no results$|^no holds$/i.test(v)){content.innerHTML=empty('No records to show','There is no activity matching this view. Return to the main screen to continue.');}if(/^loading$/i.test(v)){content.innerHTML='<div aria-busy="true" aria-label="Loading records"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';}if(/offline|denied|forbidden|deactivated|expired|loading|submitting/i.test(v)){t.content.querySelectorAll('.actionbar button[data-action],.actionbar button:not([data-action]).btn:not(.secondary):not(.quiet)').forEach(el=>el.disabled=true);}if(/other manager/i.test(v)){t.content.querySelectorAll('[data-action=reveal-kyc]').forEach(el=>el.replaceWith(Object.assign(document.createElement('p'),{textContent:'Identity evidence is visible only to the creating manager and Super Admin.',className:'muted'})));}}html=t.innerHTML;}return html;

const crudConfig={chain:{list:'A02',form:'A03',label:'chain',fields:['name','code','contact','email','phone']},branch:{list:'A04',form:'A05',label:'branch',fields:['name','chain','address','city','beneficiary','bankNumber','ifsc']},manager:{list:'A06',form:'A07',label:'manager',fields:['name','email','phone','branch','password']},vendor:{list:'A08',form:'A09',label:'vendor',fields:['name','email','phone','password']}};
function records(){if(!db.records)db.records={chain:[{id:'c1',name:'PAI',code:'PAI-01',email:'partner@example.test',status:'Active',linked:true},{id:'c2',name:'Sangeetha',code:'SAN-02',status:'Active',linked:true}],branch:db.branches.map((name,i)=>({id:'b'+i,name,chain:i===2?'Sangeetha':'PAI',address:'Bengaluru',city:'Bengaluru',beneficiary:'Store business account',bankNumber:'123456784821',ifsc:'HDFC0001234',status:'Active',linked:true})),manager:[{id:'m1',name:'Kavya Rao',email:'kavya@example.test',branch:'Indiranagar',status:'Active',linked:true},{id:'m2',name:'Arjun Menon',email:'arjun@example.test',branch:'Indiranagar',status:'Active',linked:true}],vendor:[{id:'v1',name:'Uday Mobiles',email:'uday@example.test',assignments:[...db.branches],status:'Active',linked:true},{id:'v2',name:'Star Mobiles',email:'star@example.test',assignments:['Jayanagar'],status:'Active',linked:true}],case:[{id:'t1',name:'Payment issue',reference:'SD-1042',owner:'Operations',notes:'Awaiting provider reconciliation.',status:'Open',linked:true}]};return db.records;}
function crudButton(action,label,kind,id='',cls='textlink'){return act('crud-'+action,label,cls,'',`data-kind="${kind}" data-record="${id}"`);}
function auditCrud(message){(db.adminAudit??=[]).unshift({time:new Date().toLocaleTimeString(),message});}
function syncRecords(){db.chains=records().chain.filter(r=>r.status==='Active').map(r=>r.name);db.branches=records().branch.filter(r=>r.status==='Active').map(r=>r.name);db.managerActive=records().manager.find(r=>r.id==='m1')?.status==='Active';db.deactivated=records().vendor.find(r=>r.id==='v1')?.status!=='Active';}
function crudForm(kind,r={},view=false){const cfg=crudConfig[kind];const names={name:kind==='case'?'Case title':'Name',code:'Chain code',contact:'Contact person',email:'Email address',phone:'Phone',chain:'Parent chain',branch:'Branch',address:'Address',city:'City',beneficiary:'Beneficiary business name',bankNumber:'Business account number',ifsc:'IFSC',password:r.id?'New password (optional)':'Initial password',reference:'Deal / payment reference',owner:'Assigned owner',notes:'Case notes'};let body=cfg.fields.map(f=>view?detail(names[f],esc(f==='password'?'••••••••':r[f]||'Not provided')):f==='chain'?select(names[f],f,db.chains,r[f]):f==='branch'?select(names[f],f,db.branches,r[f]):field(names[f],f,r[f]||'',f==='password'?'password':f==='email'?'email':'text')).join('');body+=view?detail('Status',r.status):select('Status','status',kind==='case'?['Open','Investigating','Resolved','Archived']:['Active','Inactive','Archived'],r.status||'Active');if(kind==='vendor'){body+=`<div><h3>Assigned branches</h3>${records().branch.filter(x=>x.status==='Active').map((x,i)=>view?detail(x.chain, r.assignments?.includes(x.name)?esc(x.name):'Not assigned'):check(x.chain+' / '+x.name,'assign'+i,r.assignments?.includes(x.name)||false)).join('')}</div>`;}return `<div class="card"><h2>${view?'View':r.id?'Edit':'Create'} ${cfg.label}</h2><div class="gap"></div><div class="form-grid">${body}</div><div class="gap"></div><div class="crud-actions">${view?crudButton('edit','Edit',kind,r.id,'btn small'):crudButton('save','Save '+cfg.label,kind,r.id,'btn small')}${go(cfg.list,'Back to list','btn small secondary')}</div></div>`;}
const adminBeforeCrud=adminScreen;
adminScreen=function(id,v){const kind=Object.keys(crudConfig).find(k=>crudConfig[k].list===id||crudConfig[k].form===id);if(!kind){let html=adminBeforeCrud(id,v);if(id==='A21'&&db.adminAudit?.length)html=html.replace('<div class="table-wrap">',`<section class="card"><h3>Latest admin changes</h3>${db.adminAudit.map(x=>detail(x.time,esc(x.message))).join('')}</section><div class="gap"></div><div class="table-wrap">`);return html;}const cfg=crudConfig[kind],items=records()[kind];if(id===cfg.form&&id!==cfg.list){let current=ui.crud?.kind===kind?items.find(r=>r.id===ui.crud.id):null;return adminWrap(id,crudForm(kind,current||{},ui.crud?.view||false));}return adminWrap(id,toolsbar('Search '+cfg.label+' records')+table(['Name','Details','Status','Actions'],items.map(r=>[esc(r.name),esc(r.email||r.chain||r.reference||r.code||''),badge(r.status,r.status==='Active'?'green':'gray'),`<div class="crud-actions">${crudButton('view','View',kind,r.id)}${crudButton('edit','Edit',kind,r.id)}${crudButton('delete',r.linked?'Archive':'Delete',kind,r.id)}${r.status==='Archived'?crudButton('restore','Restore',kind,r.id):''}</div>`]))+notice('Archive retains linked history. Unused records can be deleted. Changes last for this demo session.'),crudButton('create','Create '+cfg.label,kind,'','btn small'));};
const handleBeforeCrud=handle;
handle=function(action,b){if(!action.startsWith('crud-'))return handleBeforeCrud(action,b);const kind=b.dataset.kind||ui.crud?.kind,cfg=crudConfig[kind],id=b.dataset.record||ui.crud?.id,items=records()[kind],r=items.find(x=>x.id===id);if(['crud-create','crud-edit','crud-view'].includes(action)){ui.crud={kind,id:action==='crud-create'?'':id,view:action==='crud-view'};delete ui.forms[cfg.form];if(kind==='case')modal(action==='crud-view'?'Support case':'Manage support case',crudForm(kind,action==='crud-create'?{}:r,action==='crud-view'));else goTo(cfg.form);return;}if(action==='crud-save'){const data=values(b);if(!data.name?.trim()||(['vendor','manager'].includes(kind)&&(!data.email?.includes('@')||(!r&&data.password.length<8)))||(kind==='branch'&&(!data.chain||!data.beneficiary||!data.bankNumber||!data.ifsc))){announce('Complete the required name, account credentials or branch bank fields. New account passwords need at least 8 characters.');return;}if(items.some(x=>x.id!==id&&(x.name.toLowerCase()===data.name.trim().toLowerCase()||(data.email&&x.email===data.email)))){announce('A record with this name or email already exists.');return;}if(kind==='vendor')data.assignments=records().branch.filter(x=>x.status==='Active').filter((x,i)=>data['assign'+i]).map(x=>x.name);delete data.password;if(r)Object.assign(r,data);else items.push({...data,id:'new'+Date.now(),linked:false});auditCrud((r?'Updated ':'Created ')+cfg.label+': '+data.name);syncRecords();closeModal();delete ui.forms[cfg.form];ui.crud=null;goTo(cfg.list);announce('Saved '+cfg.label+'.');return;}if(action==='crud-delete'){ui.crud={kind,id};modal(r.linked?'Archive '+r.name+'?':'Delete '+r.name+'?',`<p>${r.linked?'This record has linked history. Archiving prevents new use and retains its transactions.':'This unused record will be removed from the demo.'}</p>`,r.linked?'Archive record':'Delete record','crud-confirm');return;}if(action==='crud-confirm'){if(kind==='chain'&&records().branch.some(x=>x.chain===r.name&&x.
