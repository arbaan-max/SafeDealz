name: Development checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/admin/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [store_manager, vendor, diagnostics]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter/${{ matrix.app }}
      - run: flutter analyze
        working-directory: flutter/${{ matrix.app }}
      - run: flutter test
        working-directory: flutter/${{ matrix.app }}
